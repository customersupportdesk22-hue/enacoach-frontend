name = "enacoach-api"
main = "server.js"
compatibility_date = "2024-10-24"
compatibility_flags = ["nodejs_compat"]

# This routes the MongoDB driver's network requests through the polyfill
[alias]
"net" = "@losblancos113/cf-mongodb-polyfills/net"
"dns" = "@losblancos113/cf-mongodb-polyfills/dns"
"tls" = "@losblancos113/cf-mongodb-polyfills/tls"