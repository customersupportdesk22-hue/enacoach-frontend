<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENA Chat – Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f6f7f9;height:100dvh;display:flex;flex-direction:column}
header{background:#ff5c00;color:#fff;padding:14px;font-weight:700;display:flex;gap:10px;align-items:center}
#back{display:none;background:none;border:0;color:#fff;font-size:20px}
main{flex:1;display:flex;min-height:0}
#list{width:300px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto}
.s{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.s b{display:block}.s small{color:#6b7280}
.s .u{float:right;background:#ff5c00;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:9px 12px;border-radius:14px}.client{background:#fff;border:1px solid #e5e7eb;align-self:flex-start}
.agent{background:#ff5c00;color:#fff;align-self:flex-end}
#bar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee}
input{flex:1;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
button.go{background:#ff5c00;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
#tf,#pf{display:none;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:#fff;border-top:1px solid #eee}
#tf input,#pf input,#pf select{min-width:0}#tf button,#pf button.go,#pf #p_note{grid-column:1/3}
#pf select{padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff}
#pf{grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:#fff;border-top:1px solid #eee}
#login{margin:auto;display:flex;gap:8px;padding:20px}
@media(max-width:700px){#list{width:100%}#chat{display:none}main.open #list{display:none}main.open #chat{display:flex}#back{display:block}}
</style></head><body>
<header><button id="back">←</button><span id="title">ENA Chat – Agent</span></header>
<div id="login"><input id="pw" type="password" placeholder="Agent password"><button class="go" id="in">Login</button></div>
<main id="main" style="display:none">
  <div id="list"></div>
  <div id="chat"><div id="msgs"></div>
    <div id="tf"><input id="f_name" placeholder="Passenger"><input id="f_phone" placeholder="Phone">
      <input id="f_from" placeholder="From"><input id="f_to" placeholder="To">
      <input id="f_date" type="date"><input id="f_time" type="time">
      <input id="f_bus" placeholder="Bus no."><input id="f_seat" placeholder="Seat">
      <input id="f_price" type="number" placeholder="Fare KES"><button class="go" id="mk">Generate &amp; send ticket</button></div>
    <div id="pf"><input id="p_method" placeholder="Method (e.g. M-Pesa)" value="M-Pesa">
      <select id="p_label"><option>Paybill</option><option>Till</option><option>Phone</option><option>Bank</option></select>
      <input id="p_number" placeholder="Paybill / Till / number"><input id="p_account" placeholder="Account no.">
      <input id="p_name" placeholder="Account name"><input id="p_amount" type="number" placeholder="Amount KES">
      <input id="p_note" placeholder="Note (optional)"><button class="go" id="pk">Send payment details</button></div>
    <div id="bar"><button class="go" id="tk">🎫</button><button class="go" id="pay">💳</button><input id="t" placeholder="Reply..."><button class="go" id="send">Send</button></div></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
var $=function(i){return document.getElementById(i)},S={},cur=null,sock;
$('in').onclick=function(){
  unlock();
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js')}catch(e){}
  sock=io('/agent',{auth:{password:$('pw').value}});
  sock.on('connect_error',function(e){alert(e.message)});
  sock.on('connect',function(){$('login').style.display='none';$('main').style.display='flex'});
  sock.on('sessions',function(a){a.forEach(function(c){S[c.id]=c});render()});
  sock.on('update',function(c){var o=S[c.id],ol=o?o.msgs.length:0,lm=c.msgs[c.msgs.length-1];if(c.msgs.length>ol&&lm&&lm.from==='client'){beep();notify(c)}S[c.id]=c;render();if(cur===c.id){show();sock.emit('read',cur)}});
};
var AC;
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function note(f,t,d,v){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(0.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(v,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+d);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.02)}
function tone(k){try{unlock();if(k==='in'){note(880,0,.18,.35);note(1175,.16,.28,.35)}else{note(660,0,.12,.18)}}catch(e){}}
function beep(){tone('in');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function notify(c){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(!document.hidden&&cur===c.id)return;
    var m=c.msgs[c.msgs.length-1],title=(c.name||'Guest')+(c.phone?' · '+c.phone:''),opt={body:m.text||'New message',tag:'enc-'+c.id,renotify:true};
    var fb=function(){try{new Notification(title,opt)}catch(e){}};
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){r?r.showNotification(title,opt):fb()}).catch(fb);else fb();
  }catch(e){}}
$('tk').onclick=function(){$('pf').style.display='none';var f=$('tf');f.style.display=f.style.display==='grid'?'none':'grid';
  if(cur){$('f_name').value=S[cur].name;$('f_phone').value=S[cur].phone}};
$('mk').onclick=function(){
  if(!cur)return;var t={};['name','phone','from','to','date','time','bus','seat','price'].forEach(function(k){t[k]=$('f_'+k).value.trim()});
  if(!t.from||!t.to||!t.date||!t.seat||!t.price)return alert('Fill from, to, date, seat and fare');
  sock.emit('ticket',{id:cur,t:t});tone('out');$('tf').style.display='none';['from','to','seat','price'].forEach(function(k){$('f_'+k).value=''})};
function render(){
  var n=Object.values(S).reduce(function(a,c){return a+(c.unread||0)},0);document.title=(n?'('+n+') ':'')+'ENA Chat – Agent';
  var l=$('list');l.innerHTML='';
  Object.values(S).sort(function(a,b){return b.last-a.last}).forEach(function(c){
    var d=document.createElement('div');d.className='s';
    d.innerHTML=(c.unread?'<span class="u">'+c.unread+'</span>':'')+'<b></b><small></small>';
    d.querySelector('b').textContent=c.name||'Guest';
    d.querySelector('small').textContent=c.phone;
    d.onclick=function(){cur=c.id;$('main').classList.add('open');$('title').textContent=(c.name||'Guest')+' · '+c.phone;show();sock.emit('read',cur)};
    l.appendChild(d)})}
function show(){
  var m=$('msgs');m.innerHTML='';
  S[cur].msgs.forEach(function(x){var d=document.createElement('div');d.className='m '+x.from;d.textContent=x.type==='payment'?'💳 Payment sent · '+x.payment.accountLabel+' '+x.payment.number+' · KES '+x.payment.amount:x.type==='ticket'?'🎫 '+x.ticket.no+' · '+x.ticket.from+' → '+x.ticket.to+' · seat '+x.ticket.seat+' · KES '+x.ticket.price:x.text;m.appendChild(d)});
  m.scrollTop=m.scrollHeight}
function send(){var v=$('t').value.trim();if(v&&cur){sock.emit('reply',{id:cur,text:v});tone('out');$('t').value=''}}
var PK=['method','label','number','account','name'],DEF={};
fetch('/api/settings').then(function(r){return r.json()}).then(function(o){
  DEF={label:o.type==='till'?'Till':'Paybill',number:o.number||'',account:o.account||''};fillPay()}).catch(function(){});
function fillPay(){PK.forEach(function(k){var v=localStorage.getItem('pay_'+k)||DEF[k];if(v)$('p_'+k).value=v})}
$('pay').onclick=function(){$('tf').style.display='none';var f=$('pf');f.style.display=f.style.display==='grid'?'none':'grid';fillPay()};
$('pk').onclick=function(){
  if(!cur)return;var p={};['method','label','number','account','name','amount','note'].forEach(function(k){p[k]=$('p_'+k).value.trim()});
  if(!p.number||!p.amount)return alert('Enter the number and the amount');
  PK.forEach(function(k){localStorage.setItem('pay_'+k,p[k])});
  p.accountLabel=p.label;delete p.label;
  sock.emit('payment',{id:cur,p:p});tone('out');$('pf').style.display='none';$('p_amount').value='';$('p_note').value=''};
$('send').onclick=send;$('t').onkeydown=function(e){if(e.key==='Enter')send()};
$('back').onclick=function(){$('main').classList.remove('open');$('title').textContent='ENA Chat – Agent'};
</script>
</body>
</html>
